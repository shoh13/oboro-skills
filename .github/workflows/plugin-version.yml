name: plugin-version

# Installed copies refresh only when the version goes up, so every change to the plugin must bump it.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The pull_request checkout is the merge commit, so HEAD^1 is the tip of the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: .github/scripts/check-plugin-version.sh HEAD^1 HEAD
