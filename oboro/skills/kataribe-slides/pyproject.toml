[project]
name = "kataribe"
version = "0.1.0"
description = "音声の実測長に同期する、ずんだもんと四国めたんの掛け合いの解説動画を作るプラグイン"
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "pillow>=10.1",
    "playwright>=1.48",
    "psd-tools>=1.9",
    "python-pptx>=1.0.2",
]

[project.scripts]
kataribe = "kataribe.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kataribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["integration: 実際の VOICEVOX（Docker）を使うテスト。Docker が使えるときだけ実行する"]

[tool.pyright]
extraPaths = ["tests"]
include = ["src", "tests"]
