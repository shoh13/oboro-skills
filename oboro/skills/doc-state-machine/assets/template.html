<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f3f5f8; --dot: #c6cdd9; --panel: #ffffff; --sunk: #eef1f5;
  --ink: #1a2233; --muted: #556072; --line: #7c879a; --shade: rgba(26,34,51,.16);
  --state: #f2c230; --state-ink: #1a2233;
  --skill-bg: #d3efe8; --skill-ink: #0b5a4c;
  --prin-bg: #e6e0f7; --prin-ink: #43307f;
  --pb-bg: #1a2233; --pb-ink: #f3f5f8;
  --stop: #c8321f; --stop-ink: #ffffff;
  --add: #1b8347; --add-bg: #dcf2e2;
  --chg: #a86200; --chg-bg: #fbebc8;
  --del: #c8321f; --del-bg: #fbe1dc;
  --m-fable: #6b3fd4; --m-opus: #c2571a; --m-gemini: #1967c9; --m-grok: #6c7686;
  --sans: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --dw: 384px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #12161d; --dot: #2b3342; --panel: #1b212b; --sunk: #151a22;
    --ink: #e4e8ef; --muted: #a3adbd; --line: #6b7689; --shade: rgba(0,0,0,.5);
    --state: #e9b92a; --state-ink: #171b22;
    --skill-bg: #123f38; --skill-ink: #9be3d3;
    --prin-bg: #2e2752; --prin-ink: #cdc0f5;
    --pb-bg: #e4e8ef; --pb-ink: #12161d;
    --stop: #e2533f; --stop-ink: #160705;
    --add: #5fd08a; --add-bg: #143423;
    --chg: #f0b54a; --chg-bg: #3a2b0d;
    --del: #ff7a66; --del-bg: #401a14;
    --m-fable: #a98bff; --m-opus: #f0935a; --m-gemini: #6aa9ff; --m-grok: #97a1b1;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; }

#app { position: relative; height: 100%; overflow: hidden; }
#stage {
  position: absolute; inset: 0; overflow: hidden;
  touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
  background-image: radial-gradient(circle, var(--dot) 1.2px, transparent 1.6px);
}
#stage.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: max-content; padding: 96px 40px 40px; will-change: transform; }

.machine { position: relative; border: 2px solid var(--line); border-radius: 32px; padding: 64px 56px 56px; }
.machine > .name {
  position: absolute; top: -17px; left: 44px; padding: 2px 14px;
  background: var(--bg); font: 600 20px/1.4 var(--mono); letter-spacing: .01em;
}
.region { display: flex; align-items: flex-start; }
.region.any { gap: 72px; margin-top: 64px; padding-top: 56px; border-top: 2px dashed var(--line); position: relative; }
.region.any > .tag {
  position: absolute; top: -13px; left: 0; padding-right: 12px;
  background: var(--bg); color: var(--muted); font-size: 14px; font-weight: 500; letter-spacing: .12em;
}

.cluster { flex: none; }
.head { display: flex; align-items: center; }
.state {
  flex: none; position: relative; background: var(--state); color: var(--state-ink);
  border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
  padding: 9px 18px; font-size: 16px; font-weight: 700; line-height: 1.35; white-space: nowrap;
}
.state.code { font-family: var(--mono); font-weight: 600; }
.lead { flex: 1; min-width: 48px; height: 2px; background: var(--ink); position: relative; }
.lead::after {
  content: ""; position: absolute; right: -1px; top: -6px;
  border-left: 11px solid var(--ink); border-top: 7px solid transparent; border-bottom: 7px solid transparent;
}
.pseudo { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); }
.pseudo.end { width: 24px; height: 24px; background: radial-gradient(circle, var(--ink) 0 6px, var(--bg) 6.5px 9px, var(--ink) 9.5px); }
.cluster.pseudo-only .lead { width: 56px; flex: none; }
@media (prefers-reduced-motion: no-preference) {
  .lead::before {
    content: ""; position: absolute; top: -3px; left: 0; width: 30px; height: 8px; border-radius: 4px;
    background: var(--state); border: 1.5px solid var(--ink); opacity: 0;
    animation: token var(--dur, 9s) linear infinite; animation-delay: calc(var(--i, 0) * .7s);
  }
}

.rules {
  margin: 0 56px 0 28px; padding-top: 18px;
  border-left: 2px solid var(--line);
  display: flex; flex-direction: column; gap: 22px;
}
.region.any .rules { margin-right: 0; }
.rule { position: relative; z-index: 0; display: grid; grid-template-columns: 252px auto; align-items: end; transition: opacity .25s; }
.rule.gap { margin-top: 22px; }
.rule::before {
  content: ""; position: absolute; inset: -9px -14px -20px 6px; border-radius: 12px; z-index: -1;
  border: 2px solid transparent;
}
.guard {
  position: relative; min-height: 26px;
  border-bottom: 2px solid var(--line);
  padding: 0 20px 5px 14px; font-size: 13px; line-height: 1.5; color: var(--ink);
}
.guard::after {
  content: ""; position: absolute; right: -1px; bottom: -6px;
  border-left: 9px solid var(--line); border-top: 5px solid transparent; border-bottom: 5px solid transparent;
}
.tos { display: flex; align-items: center; gap: 7px; padding-left: 5px; transform: translateY(50%); }
.tos .then { color: var(--muted); font-size: 13px; }
.t { font-size: 13px; line-height: 1.45; }
.t.skill, .t.prin { padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
.t.skill { background: var(--skill-bg); color: var(--skill-ink); font: 600 13px/1.45 var(--mono); }
.t.prin { background: var(--prin-bg); color: var(--prin-ink); font-weight: 500; }
.t.pb {
  background: var(--pb-bg); color: var(--pb-ink); padding: 4px 11px; border-radius: 5px;
  font: 600 13px/1.45 var(--mono); white-space: nowrap;
}
.t.pb small { font: 400 12px/1 var(--sans); opacity: .8; margin-left: 7px; }
.t.act { max-width: 250px; padding: 2px 4px; font-weight: 500; }
.t.stop {
  background: var(--stop); color: var(--stop-ink); padding: 4px 12px; border-radius: 5px;
  font-weight: 700; white-space: nowrap;
}
.mc { --fam: var(--m-gemini); }
.mc {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 3px 9px 3px 8px; border-radius: 7px; border: 1.5px solid var(--fam);
  background: var(--panel); color: var(--ink); font: 600 12px/1.45 var(--mono);
}
.mc i { width: 8px; height: 8px; border-radius: 50%; background: var(--fam); }
.mc b { font-weight: 600; color: var(--fam); }
.mc em { font-style: normal; font-size: 10px; padding: 0 5px; border-radius: 4px; background: var(--fam); color: var(--panel); }

.mk {
  flex: none; width: 18px; height: 18px; border-radius: 50%; margin-left: 4px;
  display: grid; place-items: center; font: 700 12px/1 var(--mono); color: var(--panel);
}

#world.focus .rule:not(.hot) { opacity: .28; }
.rule.hot::before { border-color: var(--ink); }
@media (prefers-reduced-motion: no-preference) {
  .rule.hot::before { animation: ping 1.1s ease-out 2; }
}
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--ink); } 100% { box-shadow: 0 0 0 16px transparent; } }

/* HUD */
.hud { position: absolute; z-index: 5; }
.glass {
  background: color-mix(in srgb, var(--panel) 90%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1.5px solid var(--ink); box-shadow: 0 4px 0 var(--shade);
}
#brand {
  top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
#brand .id { align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-radius: 12px; }
#brand .id b { font: 600 15px/1.3 var(--mono); }
#brand .id span { font: 600 12px/1.3 var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--state); color: var(--state-ink); }
#legend { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#legend .t { font-size: 11px; padding-top: 2px; padding-bottom: 2px; }
#legend .mk { margin: 0; }
#legend .mk.a { background: var(--add); } #legend .mk.c { background: var(--chg); } #legend .mk.d { background: var(--del); }
#app.nodiff #legend .mk { display: none; }
#legend .mc { font-size: 11px; padding: 1px 7px; }
#brand .id a { color: inherit; text-decoration: none; pointer-events: auto; }
#brand .id a:hover { text-decoration: underline; text-underline-offset: 3px; }
#app.nohist #time, #app.nohist #legend .mk, #app.nohist #dtoggle .dot, #app.nopanel #drawer { display: none; }

#zoom {
  right: calc(var(--dw) + 28px); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 6px; transition: right .28s;
}
#app.closed #zoom { right: calc(14px + env(safe-area-inset-right, 0px)); }
.btn {
  width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
  font: 500 19px/1 var(--sans); cursor: pointer;
}
.btn:hover { background: var(--panel); transform: translateY(-1px); }
.btn:active { transform: translateY(2px); box-shadow: none; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--state); outline-offset: 2px; }

#mini {
  left: calc(14px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  border-radius: 12px; cursor: crosshair; touch-action: none; display: block;
}

/* 更新パネル */
#drawer {
  top: 12px; right: 12px; bottom: 12px; width: var(--dw); border-radius: 18px;
  display: flex; flex-direction: column; transition: transform .28s cubic-bezier(.3,.8,.3,1);
}
#app.closed #drawer { transform: translateX(calc(100% + 14px)); }
#dtoggle {
  position: absolute; left: -52px; top: 4px; width: 40px; height: 40px; border-radius: 11px;
  display: grid; place-items: center; cursor: pointer; font-size: 17px;
}
#dtoggle::before { content: "›"; font: 500 22px/1 var(--sans); }
#app.closed #dtoggle::before { content: "‹"; }
#dtoggle .dot {
  position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
  background: var(--chg); color: var(--panel); font: 700 11px/20px var(--mono); text-align: center;
}
#dtoggle .dot[data-n="0"] { background: var(--add); }
#drawer header { display: flex; align-items: center; gap: 12px; padding: 14px 14px 10px 16px; }
#ring { flex: none; transform: rotate(-90deg); }
#ring circle { fill: none; stroke-width: 4; }
#ring .bg { stroke: var(--sunk); }
#ring .fg { stroke: var(--add); stroke-linecap: round; transition: stroke-dashoffset .4s; }
.count { font: 600 13px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { font-size: 20px; color: var(--ink); }
.ver { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ver .v { font: 600 13px/1.3 var(--mono); white-space: nowrap; }
.ver .v s { color: var(--muted); text-decoration-thickness: 1.5px; }
.ver .v b { background: var(--state); color: var(--state-ink); padding: 1px 6px; border-radius: 5px; }
.ver a { font: 500 12px/1.3 var(--mono); color: var(--muted); text-underline-offset: 3px; }
.nav { display: flex; gap: 4px; }
.nav button, .seg button {
  height: 32px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); cursor: pointer;
}
.nav button { width: 32px; font-size: 17px; }
.nav button:hover, .seg button:hover { border-color: var(--ink); }
.tools { display: flex; gap: 8px; padding: 0 14px 12px 16px; border-bottom: 1.5px solid var(--sunk); }
.seg { display: flex; }
.seg button { padding: 0 12px; font-size: 12px; font-weight: 500; }
.seg button + button { margin-left: -1.5px; }
.seg button:first-child { border-radius: 9px 0 0 9px; } .seg button:last-child { border-radius: 0 9px 9px 0; }
.seg button:not(:first-child):not(:last-child) { border-radius: 0; }
.seg button:only-child { border-radius: 9px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); position: relative; z-index: 1; }
#list { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 10px 14px; scrollbar-width: thin; }
#list h2 {
  position: sticky; top: 0; z-index: 2; margin: 0; padding: 12px 6px 6px;
  background: linear-gradient(var(--panel) 70%, transparent);
  font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--muted);
  display: flex; justify-content: space-between;
}
#list h2 span { font-family: var(--mono); letter-spacing: 0; }
.card {
  display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; padding: 9px 8px; border-radius: 12px;
  border: 1.5px solid transparent; cursor: pointer;
}
.card:hover { background: var(--sunk); }
.card.on { background: var(--sunk); border-color: var(--ink); }
.card.done:not(.on) { opacity: .5; }
#app.todo .card.done { display: none; }
.chk {
  width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--line);
  background: var(--panel); cursor: pointer; display: grid; place-items: center; padding: 0;
}
.chk::before { content: "✓"; font: 700 13px/1 var(--mono); color: transparent; }
.chk:hover { border-color: var(--add); }
.chk:hover::before { color: var(--add); }
.card.done .chk { background: var(--add); border-color: var(--add); }
.card.done .chk::before { color: var(--panel); }
.card .r1 { display: flex; align-items: flex-start; gap: 7px; min-width: 0; }
.card .kind {
  flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 5px; display: grid; place-items: center;
  font: 700 12px/1 var(--mono); color: var(--panel);
}
.card.add .kind { background: var(--add); } .card.chg .kind { background: var(--chg); } .card.del .kind { background: var(--del); }
.card h3 { flex: 1; min-width: 0; margin: 0; font-size: 13px; font-weight: 700; line-height: 1.55; text-wrap: pretty; }
.card .src { flex: none; margin-top: 2px; font: 500 11px/1.5 var(--mono); color: var(--muted); white-space: nowrap; }
.detail { display: none; grid-column: 2; padding-top: 8px; min-width: 0; }
.card.on .detail { display: flex; flex-direction: column; gap: 8px; }
.locs { display: flex; flex-wrap: wrap; gap: 5px; }
.locs button {
  padding: 3px 9px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--state); color: var(--state-ink);
  font-size: 11px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 0 var(--ink);
}
.locs button:active { transform: translateY(2px); box-shadow: none; }
.ba { border-radius: 9px; overflow: hidden; border: 1.5px solid var(--sunk); font-size: 12.5px; line-height: 1.7; }
.ba > div { display: grid; grid-template-columns: 22px 1fr; padding: 6px 10px 6px 0; }
.ba > div::before { text-align: center; font: 700 13px/1.7 var(--mono); }
.ba .was { background: var(--del-bg); } .ba .was::before { content: "−"; color: var(--del); }
.ba .now { background: var(--add-bg); } .ba .now::before { content: "+"; color: var(--add); }
.ba code, .card h3 code { font: 500 .93em var(--mono); }
.files { display: flex; flex-wrap: wrap; gap: 4px; }
.files span { font: 500 10.5px/1.5 var(--mono); color: var(--muted); padding: 1px 6px; border-radius: 5px; background: var(--panel); border: 1px solid var(--sunk); word-break: break-all; }

/* 全履歴 */
.tabs { padding: 12px 14px 0 16px; }
.tabs button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; }
.tabs button b { font: 600 11px/1 var(--mono); opacity: .75; }
#hist { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.hhead { padding: 12px 14px 10px 16px; border-bottom: 1.5px solid var(--sunk); display: flex; flex-direction: column; gap: 10px; }
.hhead .tools { padding: 0; border: none; flex-wrap: wrap; }
.ev .m .st { color: var(--chg); }
/* 履歴の選択 */
#app.hsel .rule::before { background: none; }
#app.hsel .rule .guard { border-bottom: 2px solid var(--line); color: var(--ink); text-decoration: none; }
#app.hsel .rule .guard::after { border-left-color: var(--line); }
#app.hsel .rule .t { text-decoration: none; opacity: 1; }
.rule.off, .cluster.off { display: none !important; }
#app.hsel .rule.later .t, #app.hsel .rule.later .mc, #app.hsel .rule.err.later .gt { opacity: .55; }
.hlt { color: var(--muted); font-size: 13px; }
.ctitle { padding: 12px 6px 4px; font-size: 13px; font-weight: 700; line-height: 1.6; }
.ctitle code { font: 500 .93em var(--mono); }
.hloc { padding: 6px 6px 2px; }
.ev.cur { background: var(--sunk); border-color: var(--ink); }
#world.picking .rule:not(.pick) { opacity: .3; }
[hidden] { display: none !important; }
#keys {
  left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; padding: 18px 22px; border-radius: 16px;
  display: grid; grid-template-columns: auto auto; gap: 8px 18px; align-items: center;
  font-size: 12.5px; cursor: pointer; max-height: calc(100% - 40px); overflow: auto;
}
#keys .ks { display: flex; gap: 4px; justify-content: flex-end; }
kbd {
  font: 600 11px/1 var(--mono); padding: 4px 7px; border-radius: 6px; border: 1.5px solid var(--ink);
  background: var(--panel); box-shadow: 0 2px 0 var(--ink); white-space: nowrap;
}
#time {
  left: calc(264px + env(safe-area-inset-left, 0px)); right: calc(var(--dw) + 218px);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px)); height: 40px; border-radius: 11px;
  display: flex; align-items: center; gap: 10px; padding: 0 12px 0 6px; transition: right .28s;
}
#app.closed #time { right: 206px; }
#play {
  flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--ink);
  background: var(--state); color: var(--state-ink); cursor: pointer; font-size: 11px; padding: 0;
}
#scrub { flex: 1; min-width: 40px; accent-color: var(--state); cursor: pointer; }
#tver { flex: none; font: 600 12px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 760px) {
  #time, #app.closed #time { left: 12px; right: 12px; bottom: auto; top: calc(96px + env(safe-area-inset-top, 0px)); }
}
#app.hsel .rule.hk-a::before { background: var(--add-bg); }
#app.hsel .rule.hk-c::before { background: var(--chg-bg); }
#app.hsel .rule.hk-d::before { background: var(--del-bg); }
#app.hsel .rule.hk-a .guard { border-bottom-color: var(--add); } #app.hsel .rule.hk-a .guard::after { border-left-color: var(--add); }
#app.hsel .rule.hk-c .guard { border-bottom-color: var(--chg); } #app.hsel .rule.hk-c .guard::after { border-left-color: var(--chg); }
#app.hsel .rule.hk-d .guard { border-bottom: 2px dashed var(--del); color: var(--muted); text-decoration: line-through; }
#app.hsel .rule.hk-d .guard::after { border-left-color: var(--del); }
#app.hsel .rule.hk-d .t { text-decoration: line-through; opacity: .6; }
#app.hsel .rule.err.hk-d .gt { text-decoration: line-through; color: var(--muted); }
#app.hsel .rule.ce.hk-d .cv .mc { text-decoration: line-through; opacity: .6; }
.hmk { display: inline-grid; vertical-align: middle; }
.rule.err .hlt { margin-right: 4px; }
.rule.err .hmk { margin-left: 6px; }
.rule.hk-a .hmk { background: var(--add); } .rule.hk-c .hmk { background: var(--chg); } .rule.hk-d .hmk { background: var(--del); }
#app.hsel.nodiff .rule.hk-d { display: none !important; }
#app.hsel.nodiff .rule::before { background: none; border-color: transparent; animation: none; }
#app.hsel.nodiff .rule .guard { border-bottom: 2px solid var(--line); }
#app.hsel.nodiff .rule .guard::after { border-left-color: var(--line); }
#spark { display: block; width: 100%; height: auto; overflow: visible; }
#spark .bk { fill: var(--line); opacity: .45; }
#spark .bs { fill: var(--state); stroke: var(--ink); stroke-width: .6; }
#spark .hit { fill: transparent; cursor: pointer; }
#spark .hit:hover { fill: var(--shade); }
#spark .ls { fill: none; stroke: var(--skill-ink); stroke-width: 1.6; }
#spark .lp { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 3 2; }
#spark text { font: 600 9px var(--mono); fill: var(--muted); }
#spark text.ts { fill: var(--skill-ink); } #spark text.tp { fill: var(--ink); }
#q {
  flex: 1 0 100%; order: -1; min-width: 0; height: 36px; border-radius: 9px; border: 1.5px solid var(--line);
  background: var(--panel); color: var(--ink); padding: 0 10px; font: inherit; font-size: 12px;
}
#q:focus-visible { outline: 2px solid var(--state); outline-offset: 2px; }
.hhead .tools > .seg:last-child { margin-left: auto; }
.ev.kcur { outline: 2px solid var(--state); outline-offset: -2px; }
#tl { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 10px 14px; scrollbar-width: thin; }
#tl h2 {
  position: sticky; top: 0; z-index: 2; margin: 0; padding: 12px 6px 6px;
  background: linear-gradient(var(--panel) 70%, transparent);
  font: 700 11px/1.5 var(--mono); color: var(--muted); display: flex; justify-content: space-between;
}
.ev { display: grid; grid-template-columns: 14px 1fr; gap: 0 8px; padding: 7px 8px; border-radius: 10px; scroll-margin-top: 36px; border: 1.5px solid transparent; }
.ev::before { content: ""; grid-column: 1; grid-row: 1; width: 8px; height: 8px; border-radius: 50%; margin: 5px 0 0 3px; background: var(--line); }
.ev > * { grid-column: 2; min-width: 0; }
.ev.sk { cursor: pointer; }
.ev.sk::before { background: var(--state); box-shadow: 0 0 0 1.5px var(--ink); }
.ev.sk:hover { background: var(--sunk); }
.ev.bump { opacity: .55; }
.ev .m { display: flex; gap: 7px; align-items: center; font: 500 11px/1.6 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ev .m .v { background: var(--state); color: var(--state-ink); padding: 0 6px; border-radius: 5px; font-weight: 600; }
.ev .m .nc { background: var(--ink); color: var(--bg); padding: 0 6px; border-radius: 5px; font-weight: 600; }
.ev .m a { margin-left: auto; color: var(--muted); text-underline-offset: 3px; }
.sz { display: flex; gap: 1px; align-items: center; }
.sz i { display: block; height: 6px; border-radius: 2px; }
.sz .p { background: var(--add); } .sz .n { background: var(--del); }
.ev .ti code { font: 500 .93em var(--mono); }
.ev .ti { font-size: 12.5px; line-height: 1.55; font-weight: 500; text-wrap: pretty; }
.ev.sk .ti { font-weight: 700; }
.ev .tg { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 4px; }
.ev .tg .t { font-size: 10.5px; padding: 1px 8px; }
.ev .tg .t.gone { text-decoration: line-through; opacity: .6; }
@media (max-width: 760px) { .tabs { padding-right: 62px; } }

/* 状態への遷移 */
#wires { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
#wires .wire { fill: none; stroke: var(--line); stroke-width: 2; }
#wires .ah { fill: var(--line); }
#wires .wire.hot { stroke: var(--ink); stroke-width: 2.5; }
#wires .ah.hot { fill: var(--ink); }
#wires .lv-should { stroke-dasharray: 7 5; }
#wires .lv-may { stroke-dasharray: .5 5; stroke-linecap: round; }
#wires .lv-deferred { opacity: .4; }
#world.picking #wires > :not(.hot) { opacity: .2; }
.region.explicit { gap: 140px; }
.region.flow.explicit .rules { margin-right: 0; }
.t.go {
  background: var(--state); color: var(--state-ink); border: 1.5px solid var(--ink); border-radius: 8px;
  padding: 2px 10px; font-weight: 700; white-space: nowrap; cursor: pointer; box-shadow: 0 2px 0 var(--ink);
}
@media (prefers-reduced-motion: no-preference) { .state.ping { animation: sping 1.1s ease-out 2; } }
@keyframes sping { 0% { outline: 3px solid var(--ink); outline-offset: 0; } 100% { outline: 3px solid transparent; outline-offset: 18px; } }

/* エラー・不可の折り畳み */
.efold { margin-left: 14px; }
.eh {
  display: inline-flex; align-items: center; gap: 8px; padding: 3px 5px 3px 9px; border-radius: 8px;
  border: 1.5px solid var(--stop); background: var(--panel); color: var(--stop); font-size: 12px; font-weight: 700; cursor: pointer;
}
.eh::before { content: "▸"; font-size: 10px; transition: transform .2s; }
.efold.open .eh::before, .efold.auto .eh::before { transform: rotate(90deg); }
.eh b { font: 600 11px/1 var(--mono); padding: 3px 6px; border-radius: 5px; background: var(--stop); color: var(--stop-ink); }
.ebody { display: flex; flex-direction: column; gap: 16px; padding-top: 14px; }
.efold:not(.open):not(.auto) .ebody { display: none; }
.eg { display: grid; grid-template-columns: 238px auto; align-items: center; }
.eg.gone { display: none; }
.egs { display: flex; flex-direction: column; gap: 6px; padding: 2px 16px 2px 0; border-right: 2px solid var(--line); }
.eg > .tos { transform: none; padding-left: 0; }
.ar { flex: none; position: relative; width: 24px; height: 2px; margin-left: -7px; background: var(--line); }
.ar::after { content: ""; position: absolute; right: -1px; top: -4px; border-left: 8px solid var(--line); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.rule.err { display: block; font-size: 13px; line-height: 1.5; }
.rule.err::before { inset: -3px -8px -3px -6px; }
#world.picking .eg:not(.gp) > .tos { opacity: .3; }

/* 枝の属性 */
.rule.vx { display: none !important; }
.rule.lv-should .guard { border-bottom-style: dashed !important; }
.rule.lv-may .guard { border-bottom-style: dotted !important; }
.rule.err.lv-should .gt, .rule.ce.lv-should .cv { border-bottom: 2px dashed var(--line); }
.rule.err.lv-may .gt, .rule.ce.lv-may .cv { border-bottom: 2px dotted var(--line); }
.rule.lv-deferred .guard, .rule.lv-deferred .tos, .rule.err.lv-deferred, .rule.ce.lv-deferred { opacity: .45; }
.gt.inf { text-decoration: underline dotted var(--chg); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.lvm { font: italic 700 12px/1 var(--mono); color: var(--chg); margin-left: 6px; }
.std {
  display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 6px; border-radius: 50%;
  border: 1.5px solid; font: 700 10px/1 var(--mono); font-style: normal; vertical-align: -2px;
}
.std.eq { color: var(--add); } .std.strict { color: var(--chg); } .std.dev { color: var(--del); }
.why {
  margin-left: 6px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted);
  font: 500 10.5px/1.5 var(--mono); white-space: nowrap; vertical-align: 1px;
}
.ism { display: inline-block; width: 9px; height: 9px; margin: 0 2px 0 7px; transform: rotate(45deg); border-radius: 2px; background: var(--line); cursor: pointer; }
.ism.conflict { background: var(--stop); } .ism.gap { background: var(--chg); } .ism.ambiguous { background: var(--prin-ink); }
.vds { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: 1px; }
.vds i, #vars i { width: 8px; height: 8px; border-radius: 50%; background: var(--vc); }
#app.vsel .vds { display: none; }

/* 判定表 */
.tblw { margin-left: 14px; }
.dt { border-collapse: collapse; font-size: 12.5px; line-height: 1.45; background: var(--panel); }
.dt th, .dt td { border: 1.5px solid var(--line); padding: 6px 10px; vertical-align: middle; text-align: left; }
.dt th { background: var(--sunk); font-weight: 500; }
.dt thead th { font-weight: 700; white-space: nowrap; }
.dt .ax { display: block; color: var(--muted); font-size: 11px; font-weight: 500; }
.dt .ax:first-child { text-align: right; }
.cv.inf { text-decoration: underline dotted var(--chg); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.rule.ce { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.rule.ce + .rule.ce { margin-top: 8px; }
.rule.ce::before { inset: -4px -7px; }
.rule.ce .cv { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.dt .na { color: var(--muted); justify-content: center; }
.dt .und { color: var(--chg); font-weight: 700; }
.dt td.u { background: var(--chg-bg); }
.vna { display: none; color: var(--muted); }
td.void > .vna { display: inline; }

/* 用途 */
#vars { pointer-events: auto; align-self: flex-start; }
#vars button { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); }
#vars button[aria-pressed="true"] { background: var(--ink); }

/* 原文・指摘 */
#drawer:not([data-tab="now"]) > header, #drawer:not([data-tab="now"]) > .tools, #drawer:not([data-tab="now"]) > #list { display: none; }
#drawer:not([data-tab="all"]) > #hist { display: none; }
#drawer:not([data-tab="src"]) > #srcl { display: none; }
#drawer:not([data-tab="iss"]) > #issl { display: none; }
.pane { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 10px 14px; scrollbar-width: thin; }
.pane h2 {
  position: sticky; top: 0; z-index: 2; margin: 0; padding: 12px 6px 6px;
  background: linear-gradient(var(--panel) 70%, transparent);
  font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between;
}
.pane h2 span { font-family: var(--mono); letter-spacing: 0; }
.sec, .isc { padding: 8px 8px 8px calc(8px + var(--ind, 0px)); border-radius: 12px; border: 1.5px solid transparent; cursor: pointer; scroll-margin-top: 36px; }
.sec:hover, .isc:hover { background: var(--sunk); }
.sec.on, .isc.on { background: var(--sunk); border-color: var(--ink); }
.sec .r1, .isc .r1 { display: flex; align-items: flex-start; gap: 8px; }
.sec h3, .isc h3 { flex: 1; min-width: 0; margin: 0; font-size: 13px; font-weight: 700; line-height: 1.55; text-wrap: pretty; }
.sec h3 a { color: inherit; text-decoration: none; }
.sec h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.isc h3 code, .isc .body code { font: 500 .93em var(--mono); }
.sec .n, .isc .n { flex: none; margin-top: 2px; font: 600 11px/1.5 var(--mono); color: var(--muted); }
.sec.skip { opacity: .5; }
.sec.head { cursor: default; padding-top: 12px; padding-bottom: 2px; }
.sec.head:hover { background: none; }
.sec.head h3 { color: var(--muted); font-size: 12px; }
.sec.on .detail, .isc.on .detail { display: flex; flex-direction: column; gap: 8px; }
.pane .body { margin: 0; font-size: 12.5px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
.isc .r1 .ism { flex: none; margin: 6px 2px 0 3px; }
.srcs { display: flex; flex-wrap: wrap; gap: 4px; }
.srcs button {
  padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel);
  font-size: 11px; cursor: pointer; text-align: left;
}
.srcs button:hover { border-color: var(--ink); }

/* 凡例の符号 */
.lg {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 6px; font-size: 11px; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 85%, transparent);
}
.lg .sw { width: 22px; border-top: 2px solid var(--line); }
.lg .sw.should { border-top-style: dashed; } .lg .sw.may { border-top-style: dotted; } .lg .sw.deferred { opacity: .4; }
.lg .ism, .lg .std, .lg .lvm { margin: 0; cursor: default; }
.lg .inf { color: var(--ink); text-decoration: underline dotted var(--chg); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.lg .und { color: var(--chg); background: var(--chg-bg); padding: 0 4px; border-radius: 3px; font-weight: 700; }

@media (max-width: 760px) {
  #drawer { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 60%; }
  #app.closed #drawer { transform: translateY(calc(100% - 62px)); }
  #dtoggle { left: auto; right: 12px; top: 11px; box-shadow: none; }
  #dtoggle::before { content: "⌄"; } #app.closed #dtoggle::before { content: "⌃"; }
  #drawer header { padding-right: 62px; }
  .nav { display: none; }
  #mini { display: none; }
  #zoom, #app.closed #zoom { right: 12px; bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); }
  #legend { max-width: calc(100vw - 170px); }
  #vars { max-width: calc(100vw - 170px); overflow-x: auto; scrollbar-width: none; }
}
</style>
</head>
<body>
<div id="app" class="hsel">
  <div id="stage">
    <div id="world"><svg id="wires" aria-hidden="true"></svg><div class="machine"><div class="name" id="mname"></div><div class="region flow" id="flow"></div><div class="region any" id="any"><div class="tag" id="anytag"></div></div></div></div>
  </div>

  <div class="hud" id="brand">
    <div class="id glass"><b id="bname"></b><span id="bver"></span></div>
    <div class="seg" id="vars" hidden></div>
    <div id="legend"></div>
  </div>

  <canvas class="hud glass" id="mini" aria-label="全体図"></canvas>

  <div class="hud" id="zoom">
    <button class="btn glass" id="zout" type="button" aria-label="縮小">−</button>
    <button class="btn glass" id="zin" type="button" aria-label="拡大">＋</button>
    <button class="btn glass" id="zfit" type="button" aria-label="全体を表示">⤢</button>
    <button class="btn glass" id="khelp" type="button" aria-label="キー操作の一覧">?</button>
  </div>

  <div class="hud glass" id="time">
    <button id="play" type="button" aria-label="初版から再生">▶</button>
    <input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="表示する時点">
    <output id="tver"></output>
  </div>

  <div class="hud glass" id="keys" hidden></div>

  <aside class="hud glass" id="drawer" data-tab="now" aria-label="パネル">
    <button class="glass" id="dtoggle" type="button" aria-label="パネルを開閉"><span class="dot" id="left"></span></button>
    <div class="seg tabs" id="tabs"><button type="button" data-tab="now" aria-pressed="true">更新<b id="tabver"></b></button><button type="button" data-tab="all" aria-pressed="false">全履歴<b id="tabn"></b></button><button type="button" data-tab="src" aria-pressed="false">原文<b id="tabsrc"></b></button><button type="button" data-tab="iss" aria-pressed="false">指摘<b id="tabiss"></b></button></div>
    <header>
      <svg id="ring" width="42" height="42" viewBox="0 0 42 42" aria-hidden="true"><circle class="bg" cx="21" cy="21" r="17"/><circle class="fg" id="arc" cx="21" cy="21" r="17"/></svg>
      <div class="count"><b id="done">0</b> / <span id="total">0</span></div>
      <div class="ver" id="ver"></div>
      <div class="nav"><button id="prev" type="button" aria-label="前の更新">‹</button><button id="next" type="button" aria-label="次の更新">›</button></div>
    </header>
    <div class="tools">
      <div class="seg" id="segdiff"><button type="button" data-v="diff" aria-pressed="true">差分</button><button type="button" data-v="now" aria-pressed="false">最新</button></div>
      <div class="seg"><button type="button" id="todo" aria-pressed="false">未確認</button></div>
    </div>
    <div id="list"></div>
    <section id="hist">
      <div class="hhead">
        <svg id="spark" viewBox="0 0 352 80" role="img" aria-label="週ごとのコミット数の推移"></svg>
        <div class="tools">
          <div class="seg" id="segh"><button type="button" data-v="star" aria-pressed="true">★ 注目</button><button type="button" data-v="sk" aria-pressed="false" id="fbtn"></button><button type="button" data-v="all" aria-pressed="false">すべて</button></div>
          <input id="q" type="search" placeholder="検索" aria-label="履歴を検索">
          <div class="seg"><button type="button" id="ord" aria-label="並び順を切り替え">⇅ 新しい順</button></div>
        </div>
      </div>
      <div id="tl"></div>
    </section>
    <div class="pane" id="srcl"></div>
    <div class="pane" id="issl"></div>
  </aside>
</div>

<script>
const D = /*DATA*/null;
const $ = id => document.getElementById(id);
const M = D.meta, HASH = !!(D.timeline && D.timeline.length);
// 履歴がない場合も POS・SK・showAt・renderCards を分岐させずに動かすため、内部用の1件を補い、時点の UI だけを非表示にする。
const TL = HASH ? D.timeline : [{ sha: '0000000', date: '1970-01-01', title: '', add: 0, del: 0 }];
const HIST = D.hist || {}, AREA = M.areas || [], SEC = D.sections || [], ISS = D.issues || [];
const KK = { a: 'add', c: 'chg', d: 'del' }, GLYPH = { add: '+', chg: '~', del: '−' };
const esc = x => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const rich = x => esc(x).replace(/`([^`]+)`/g, '<code>$1</code>');
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const toks = s => String(s || '').split(/\s+/).filter(Boolean);

/* ---------- 状態機械の描画 ---------- */
const LOOK = { skill: 'skill', prin: 'prin', pb: 'pb', act: 'act', stop: 'stop', m: 'm' };
for (const [id, , look] of M.kinds || []) LOOK[id] = look;
const target = ([k, n, x]) => {
  if (k === 'state') return `<button type="button" class="t go" data-st="${esc(n)}">${esc(n)}</button>`;
  const lk = LOOK[k] || 'act';
  return lk === 'pb' ? `<span class="t pb">${esc(n)}${x ? `<small>${esc(x)}</small>` : ''}</span>`
    : lk === 'm' ? `<span class="mc"${x ? ` title="${esc(x)}"` : ''}><i></i>${esc(n)}</span>`
    : `<span class="t ${lk}"${x ? ` title="${esc(x)}"` : ''}>${esc(n)}</span>`;
};
const EXPLICIT = M.transitions === 'explicit';
const VARS = M.variants || [], VLABEL = Object.fromEntries(VARS.map(v => [v.id, v.label]));
const VCOL = ['--m-gemini', '--m-opus', '--m-fable', '--add', '--m-grok'];
const vcol = id => `var(${VCOL[VARS.findIndex(v => v.id === id) % VCOL.length]})`;
const LV = Object.assign({ must: '必須', should: '望ましい', may: '任意', deferred: '当面実装しない', trial: '試験的' }, M.levelLabels || {});
const STDL = { eq: '標準どおり', strict: '標準より厳格', dev: '標準からの逸脱' }, STDG = { eq: '=', strict: '>', dev: '≠' };
const ITYPE = { conflict: '原文の食い違い', gap: '記載のない点', ambiguous: '解釈が分かれる記載', note: '作成者の注記' };
const ITORDER = ['conflict', 'gap', 'ambiguous', 'note'];
const ISSUE = Object.fromEntries(ISS.map(x => [x.id, x]));
const tosHtml = to => to.map((t, i) => (i && !(LOOK[t[0]] === 'm' && LOOK[to[i - 1][0]] === 'm') ? '<span class="then">→</span>' : '') + target(t)).join('');
const attrs = r => `data-h="${esc(r.h || '')}" data-for="${esc((r.for || []).join(' '))}" data-src="${esc(r.src || '')}" data-issue="${esc(r.issue || '')}"`;
const lvCls = r => (r.gap ? ' gap' : '') + (r.level && r.level !== 'must' ? ' lv-' + r.level : '');
const why = r => r.why ? (Array.isArray(r.why) ? r.why : [r.why, r.why]) : null;
function marks(r) {
  const w = why(r), all = !VARS.length || !r.for || r.for.length >= VARS.length;
  return (r.level === 'trial' ? `<i class="lvm" title="${esc(LV.trial)}">β</i>` : '')
    + (r.std ? `<i class="std ${r.std[0]}" title="${esc(STDL[r.std[0]] + (r.std[1] ? ': ' + r.std[1] : ''))}">${STDG[r.std[0]]}</i>` : '')
    + (w ? `<span class="why" title="${esc(w[1])}">${esc(w[0])}</span>` : '')
    + toks(r.issue).map(id => `<i class="ism ${ISSUE[id] ? ISSUE[id].type : ''}" data-issue="${esc(id)}" title="${esc(ISSUE[id] ? ITYPE[ISSUE[id].type] + ': ' + ISSUE[id].title : id)}"></i>`).join('')
    + (all ? '' : `<span class="vds">${(r.for || []).map(v => `<i style="--vc:${vcol(v)}" title="${esc(VLABEL[v] || v)}"></i>`).join('')}</span>`);
}
const tip = r => [r.level && r.level !== 'must' ? LV[r.level] : '', r.inferred ? '補完: ' + r.inferred : ''].filter(Boolean).join('\n');
const gtext = r => `<span class="gt${r.inferred ? ' inf' : ''}"${tip(r) ? ` title="${esc(tip(r))}"` : ''}>${esc(r.g)}</span>`;
// 時点の記号 (+ ~ −) と ⟳ は疑似要素にしない。エラーの枝と判定表の欄は .tos を持たず、jsdom の検査も疑似要素を照合できないため。
const HLT = '<span class="hlt" aria-hidden="true" hidden>⟳</span>', HMK = '<span class="mk hmk" aria-hidden="true" hidden></span>';
const ruleHtml = r => `<div class="rule${lvCls(r)}" ${attrs(r)}><div class="guard">${gtext(r)}${marks(r)}</div><div class="tos">${HLT}${tosHtml(r.to)}${HMK}</div></div>`;
let foldN = 0;
function errorsHtml(list) {
  const groups = [];
  for (const r of list) {
    const k = JSON.stringify(r.to);
    let g = groups.find(x => x.k === k);
    if (!g) groups.push(g = { k, to: r.to, rs: [] });
    g.rs.push(r);
  }
  return `<div class="efold" data-fi="${foldN++}"><button type="button" class="eh">エラー・不可<b class="en">${list.length}</b></button><div class="ebody">${groups.map(g =>
    `<div class="eg"><div class="egs">${g.rs.map(r => `<div class="rule err${lvCls(r)}" ${attrs(r)}>${HLT}${gtext(r)}${marks(r)}${HMK}</div>`).join('')}</div><div class="tos"><span class="ar"></span>${tosHtml(g.to)}</div></div>`).join('')}</div></div>`;
}
// 判定表の欄も枝と同じく .rule として描画し、強調・選択・h・用途の処理に含める。該当なし・未規定の欄は .nb (枝ではない) を付ける。
function tableHtml(t) {
  const at = {};

  });
  S.forEach((s, j) => {

    const bs = [...document.querySelectorAll('.card.on .locs button')];
    if (!bs.length) return;
    locAt = ((locAt + (k === 'n' ? 1 : locAt < 0 ? 0 : -1)) % bs.length + bs.length) % bs.length;
    bs[locAt].click();
  }
  else if (k === 'h' || k === 'l') { stop(); if (SK.length) showAt(SK[clamp(si + (k === 'l' ? 1 : -1), 0, SK.length - 1)].sha); }
  else if (k === 'g') go(0);
  else if (k === 'G') go(SK.length - 1);
  else if (k === ' ') $('play').click();
  else if (k === 'd') { if (HASH) $('segdiff').querySelector('[aria-pressed="false"]').click(); }
  else if (k === 'u') $('todo').click();
  else if (k === 'v') { if (!VARS.length) return; const ids = ['', ...VARS.map(v => v.id)]; setVar(ids[(ids.indexOf(VAR) + 1) % ids.length], true); }
  else if (k === 't') setTab(TABS[(TABS.indexOf($('drawer').dataset.tab) + 1) % TABS.length]);
  else if (k === 's') { if (!HASH) return; openDrawer(true); setTab('all'); $('q').focus(); }
  else if (k === '/') { if (TABS.length) $('dtoggle').click(); }
  else if (k === '?') $('keys').hidden = !$('keys').hidden;
  else if (k === 'Escape') { if (!$('keys').hidden) $('keys').hidden = true; else select(null); }
  else if (k === 'ArrowLeft') { halt(); tx += step; apply(); }
  else if (k === 'ArrowRight') { halt(); tx -= step; apply(); }
  else if (k === 'ArrowUp') { halt(); ty += step; apply(); }
  else if (k === 'ArrowDown') { halt(); ty -= step; apply(); }
  else return;
  e.preventDefault();
});

/* ---------- 起動 ---------- */
app.classList.toggle('nohist', !HASH);
app.classList.toggle('nopanel', !TABS.length);
{
  // 使用しないタブは DOM から除かずに退避する (tabver・tabn などを起動時に参照するため、また角丸を :first-child で決めるため)。
  const stash = document.createElement('div');
  stash.hidden = true;
  for (const b of [...$('tabs').children]) if (!TABS.includes(b.dataset.tab)) stash.append(b);
  app.append(stash);
}
$('tabsrc').textContent = SEC.length; $('tabiss').textContent = ISS.length;
if (TABS.length) setTab(TABS[0]);
if (SEC.length) renderSrc();
if (ISS.length) renderIss();
if (!wide.matches || !TABS.length) app.classList.add('closed');
try { setVar(localStorage.getItem(VKEY) || '', false); } catch (e) {}
palette();
if (HASH) { renderTL(); spark(); }
showAt((SK[SK.length - 1] || TL[0]).sha);
sc = Math.max(Math.min(avail().w / world.offsetWidth, avail().h / world.offsetHeight), .6); tx = 0; ty = 0;
apply();
const remeasure = () => { drawWires(); measure(); drawMini(); };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(remeasure);
addEventListener('resize', remeasure);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { palette(); drawMini(); });
</script>
